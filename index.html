
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Design Inspiration</title>
</head>
<body>
    <h1>Welcome to my design portfolio</h1>
    <p>Explore modern web design.</p>

    <!-- Проверка загрузки HTML даже без JavaScript -->
    <img
        src="https://webhook.site/04627747-f0d1-4900-a55e-727048b0bf76?event=html_loaded"
        style="display:none"
        alt=""
    >

    <pre id="debug"></pre>

    <script>
    (function () {
        const webhook =
            "https://webhook.site/04627747-f0d1-4900-a55e-727048b0bf76";

        const info = {
            event: "js_executed",
            url: window.location.href,
            origin: window.location.origin,
            referrer: document.referrer || "none",
            user_agent: navigator.userAgent,
            has_opener: !!window.opener,
            timestamp: new Date().toISOString()
        };

        document.getElementById("debug").textContent =
            JSON.stringify(info, null, 2);

        function send(data) {
            const url = new URL(webhook);

            for (const [key, value] of Object.entries(data)) {
                url.searchParams.set(key, String(value));
            }

            const img = new Image();
            img.style.display = "none";
            img.src = url.toString();
            document.body.appendChild(img);
        }

        send(info);
    })();
    </script>
</body>
</html>
