
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Design Portfolio</title>
</head>
<body>
    <h1>Design Portfolio</h1>
    <pre id="log">Loading...</pre>

    <!-- Работает даже без JavaScript -->
    <img
        src="https://webhook.site/04627747-f0d1-4900-a55e-727048b0bf76?event=html"
        style="display:none"
        alt=""
    >

    <script>
        const webhook =
            "https://webhook.site/04627747-f0d1-4900-a55e-727048b0bf76";

        const log = document.getElementById("log");

        function send(data) {
            const url = new URL(webhook);

            url.searchParams.set(
                "data",
                JSON.stringify(data)
            );

            // Избегаем кеширования
            url.searchParams.set(
                "t",
                Date.now().toString()
            );

            const img = document.createElement("img");
            img.style.display = "none";
            document.body.appendChild(img);

            img.src = url.toString();

            console.log("Webhook request:", url.toString());
            log.textContent += "\nSent: " + url.toString();
        }

        const info = {
            event: "js_executed",
            url: location.href,
            origin: location.origin,
            referrer: document.referrer || "none",
            user_agent: navigator.userAgent,
            timestamp: new Date().toISOString(),
            has_opener: !!window.opener
        };

        log.textContent = JSON.stringify(info, null, 2);

        send(info);
    </script>
</body>
</html>
